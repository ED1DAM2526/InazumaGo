# Aplicación: InazumaGoPrevio
# Propiedades de ejemplo
app.name=InazumaGoPrevio
app.environment=development

# ============================================================================
# FIREBASE REALTIME DATABASE CONFIGURATION
# ============================================================================
# URL base del proyecto Firebase RTDB
firebase.rtdb.url=https://your-project.firebaseio.com

# Timeouts de conexión (en milisegundos)
firebase.rtdb.timeout.connect=10000
firebase.rtdb.timeout.read=30000
firebase.rtdb.timeout.write=30000

# Configuración de reintentos HTTP
firebase.http.retry.max-attempts=3
firebase.http.retry.backoff-multiplier=2.0
firebase.http.retry.initial-delay-ms=500

# ============================================================================
# AUTHENTICATION
# ============================================================================
# Token de autenticación (obtenido dinámicamente desde Firebase Auth, no hardcodear)
# firebase.auth.token=${FIREBASE_ID_TOKEN}

# ============================================================================
# NOTA DE SEGURIDAD
# ============================================================================
# NO guardes claves privadas de Firebase en este archivo.
# Usa variables de entorno o sistemas de gestión de secretos para datos sensibles.

